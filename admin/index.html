<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>英语闯关 · 题库后台</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; padding: 0 0 60px;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    background: #f4f6fb; color: #1e293b;
  }
  .wrap { max-width: 820px; margin: 0 auto; padding: 20px 16px; }
  .top {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    background: linear-gradient(135deg, #4f46e5, #7c3aed);
    color: #fff; border-radius: 18px; padding: 18px 20px; margin-bottom: 18px;
  }
  .top h1 { font-size: 20px; margin: 0; flex: 1; }
  .top input {
    width: 140px; border: none; border-radius: 10px; padding: 8px 10px; font-size: 14px;
    outline: none;
  }
  .top button {
    border: none; background: rgba(255,255,255,0.22); color: #fff;
    padding: 8px 14px; border-radius: 10px; font-size: 14px; cursor: pointer;
  }
  .card {
    background: #fff; border-radius: 16px; padding: 16px;
    box-shadow: 0 4px 16px rgba(15,23,42,.06); margin-bottom: 14px;
  }
  .row { display: flex; align-items: center; gap: 10px; }
  .row .grow { flex: 1; min-width: 0; }
  .unit-title { font-size: 17px; font-weight: 700; }
  .meta { font-size: 13px; color: #94a3b8; margin-top: 4px; }
  .btns { display: flex; gap: 8px; flex-shrink: 0; }
  .btn {
    border: 1px solid #e2e8f0; background: #f8fafc; color: #334155;
    padding: 7px 12px; border-radius: 10px; font-size: 13px; cursor: pointer;
  }
  .btn:active { transform: scale(.97); }
  .btn-primary { background: #6366f1; border-color: #6366f1; color: #fff; }
  .btn-danger { background: #fef2f2; border-color: #fecaca; color: #dc2626; }
  .btn-mini { padding: 5px 9px; font-size: 12px; }

  .editor { background: #fff; border-radius: 18px; padding: 18px; box-shadow: 0 4px 16px rgba(15,23,42,.08); }
  .editor h2 { font-size: 17px; margin: 0 0 14px; }
  label { display: block; font-size: 13px; color: #64748b; margin: 12px 0 6px; }
  input[type=text], textarea {
    width: 100%; border: 1px solid #e2e8f0; border-radius: 10px;
    padding: 10px 12px; font-size: 14px; outline: none; font-family: inherit;
    background: #fbfcfe;
  }
  input[type=text]:focus, textarea:focus { border-color: #a5b4fc; background: #fff; }
  textarea { resize: vertical; line-height: 1.7; }
  .ta-words { min-height: 260px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
  .ta-sent { min-height: 140px; font-size: 14px; }
  .hint { font-size: 12px; color: #94a3b8; margin-top: 6px; line-height: 1.6; }
  .err { color: #dc2626; font-size: 13px; margin-top: 8px; min-height: 18px; }
  .ok { color: #16a34a; font-size: 13px; margin-top: 8px; }
  .toolbar { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
  .empty { color: #94a3b8; font-size: 14px; text-align: center; padding: 24px 0; }
  .tag { display: inline-block; font-size: 12px; color: #6366f1; background: #eef2ff; border-radius: 8px; padding: 2px 8px; margin-left: 6px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>📚 英语闯关 · 题库后台</h1>
    <input id="token" placeholder="管理口令" />
    <button onclick="saveToken()">保存口令</button>
  </div>

  <div id="list"></div>

  <div class="editor" id="editor" style="display:none">
    <h2 id="edTitle">编辑单元</h2>
    <label>单元 id（唯一，不要重复）</label>
    <input type="text" id="fId" placeholder="unit11" />
    <label>标题</label>
    <input type="text" id="fTitle" placeholder="日常口语寒暄" />
    <label>副标题</label>
    <input type="text" id="fSub" placeholder="生词 20 个 · 巩固练习" />
    <label>单词表（每行一个词）</label>
    <textarea class="ta-words" id="fWords" placeholder="hello | 你好 | hello | I said hello to her. | 我跟她打招呼了。"></textarea>
    <div class="hint">每行 5 段，用 <b>|</b> 或 Tab 分隔：<b>英文 | 中文 | 挖空答案 | 例句 | 例句中文</b><br>
      只填「英文 | 中文」也行，会自动把英文当挖空答案；例句留空则该词不进交叉练习。</div>
    <label>句子填空的句子（每行一句，纯英文，不要预先挖空）</label>
    <textarea class="ta-sent" id="fSent" placeholder="I will call you soon."></textarea>
    <div class="hint">程序会自动随机挖掉其中一个词，再从本单元单词里凑 3 个干扰项。</div>

    <div class="toolbar">
      <button class="btn btn-primary" onclick="saveUnit()">保存这个单元</button>
      <button class="btn" onclick="cancelEdit()">取消</button>
      <button class="btn" onclick="fmtHelp()">检查格式</button>
    </div>
    <div class="err" id="msg"></div>
  </div>
</div>

<script>
const base = location.origin;
let units = [];
let editing = null;
let token = localStorage.getItem('admin_token') || '';

document.getElementById('token').value = token;

function saveToken() {
  token = document.getElementById('token').value.trim();
  localStorage.setItem('admin_token', token);
  load();
}

function authHeaders() {
  return { 'Content-Type': 'application/json', 'X-Admin-Token': token };
}

async function load() {
  const box = document.getElementById('list');
  try {
    const res = await fetch(base + '/api/chapters?full=1');
    units = await res.json();
  } catch (e) {
    box.innerHTML = '<div class="card empty">连不上服务器</div>';
    return;
  }
  renderList();
}

function renderList() {
  const box = document.getElementById('list');
  if (!units.length) {
    box.innerHTML = '<div class="card empty">还没有单元，点下面的「新建单元」</div>';
  } else {
    box.innerHTML = units.map((u, i) => `
      <div class="card">
        <div class="row">
          <div class="grow">
            <div class="unit-title">${i + 1}. ${esc(u.title || '')}<span class="tag">${esc(u.id || '')}</span></div>
            <div class="meta">单词 ${(u.words || []).length} 个 · 例句 ${(u.sentences || []).length} 句 · ${esc(u.subtitle || '')}</div>
          </div>
          <div class="btns">
            <button class="btn btn-mini" onclick="move(${i},-1)">上移</button>
            <button class="btn btn-mini" onclick="move(${i},1)">下移</button>
            <button class="btn btn-mini btn-primary" onclick="editUnit(${i})">编辑</button>
            <button class="btn btn-mini btn-danger" onclick="delUnit(${i})">删除</button>
          </div>
        </div>
      </div>`).join('');
  }
  box.innerHTML += `<div class="card"><button class="btn btn-primary" onclick="newUnit()">＋ 新建单元</button></div>`;
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

function wordsToText(words) {
  return (words || []).map(w => [w.en, w.cn, w.answer, w.sentence, w.sentenceCn].map(x => x || '').join(' | ')).join('\n');
}

function textToWords(text) {
  return text.split('\n').map(l => l.trim()).filter(Boolean).map(line => {
    const parts = line.split(/\s*[|\t]\s*/);
    const en = (parts[0] || '').trim();
    const cn = (parts[1] || '').trim();
    const answer = (parts[2] || en).trim();
    const sentence = (parts[3] || '').trim();
    const sentenceCn = (parts[4] || '').trim();
    return { en, cn, answer, sentence, sentenceCn };
  }).filter(w => w.en);
}

function editUnit(i) {
  const u = units[i];
  editing = u.id;
  document.getElementById('editor').style.display = '';
  document.getElementById('edTitle').textContent = '编辑：' + (u.title || u.id);
  document.getElementById('fId').value = u.id || '';
  document.getElementById('fTitle').value = u.title || '';
  document.getElementById('fSub').value = u.subtitle || '';
  document.getElementById('fWords').value = wordsToText(u.words);
  document.getElementById('fSent').value = (u.sentences || []).join('\n');
  document.getElementById('msg').textContent = '';
  document.getElementById('editor').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function newUnit() {
  editing = null;
  document.getElementById('editor').style.display = '';
  document.getElementById('edTitle').textContent = '新建单元';
  document.getElementById('fId').value = 'unit' + String(units.length + 1).padStart(2, '0');
  document.getElementById('fTitle').value = '';
  document.getElementById('fSub').value = '';
  document.getElementById('fWords').value = '';
  document.getElementById('fSent').value = '';
  document.getElementById('msg').textContent = '';
  document.getElementById('editor').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function cancelEdit() {
  document.getElementById('editor').style.display = 'none';
}

function fmtHelp() {
  const words = textToWords(document.getElementById('fWords').value);
  const bad = words.filter(w => !w.cn).length;
  const noSent = words.filter(w => !w.sentence).length;
  document.getElementById('msg').innerHTML =
    `解析到 ${words.length} 个单词` + (bad ? `，其中 ${bad} 个没有中文释义` : '') +
    (noSent ? `，${noSent} 个没有例句（不会进交叉练习）` : '') +
    `；句子 ${document.getElementById('fSent').value.split('\n').filter(x => x.trim()).length} 句`;
}

async function saveUnit() {
  const msg = document.getElementById('msg');
  const id = document.getElementById('fId').value.trim();
  const title = document.getElementById('fTitle').value.trim();
  if (!id) { msg.className = 'err'; msg.textContent = 'id 不能为空'; return; }
  if (!title) { msg.className = 'err'; msg.textContent = '标题不能为空'; return; }
  const words = textToWords(document.getElementById('fWords').value);
  const sentences = document.getElementById('fSent').value.split('\n').map(s => s.trim()).filter(Boolean);
  if (!words.length) { msg.className = 'err'; msg.textContent = '单词表是空的'; return; }
  const body = {
    id, title,
    subtitle: document.getElementById('fSub').value.trim() || `生词 ${words.length} 个 · 巩固练习`,
    words,
    sentences
  };
  try {
    const res = await fetch(base + '/api/chapters', {
      method: 'POST', headers: authHeaders(), body: JSON.stringify(body)
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.detail || ('保存失败 ' + res.status));
    }
    msg.className = 'ok';
    msg.textContent = '已保存，前端下次打开就能看到（已学单元请到手机上刷新）';
    await load();
    editing = id;
  } catch (e) {
    msg.className = 'err';
    msg.textContent = e.message;
  }
}

async function delUnit(i) {
  const u = units[i];
  if (!confirm('确定删除「' + (u.title || u.id) + '」？')) return;
  try {
    const res = await fetch(base + '/api/chapters/' + encodeURIComponent(u.id), {
      method: 'DELETE', headers: authHeaders()
    });
    if (!res.ok) throw new Error('删除失败 ' + res.status);
    await load();
  } catch (e) {
    alert(e.message);
  }
}

async function move(i, dir) {
  const j = i + dir;
  if (j < 0 || j >= units.length) return;
  const ids = units.map(u => u.id);
  [ids[i], ids[j]] = [ids[j], ids[i]];
  try {
    const res = await fetch(base + '/api/chapters/reorder', {
      method: 'POST', headers: authHeaders(), body: JSON.stringify({ ids })
    });
    if (!res.ok) throw new Error('排序失败 ' + res.status);
    await load();
  } catch (e) {
    alert(e.message);
  }
}

load();
</script>
</body>
</html>
